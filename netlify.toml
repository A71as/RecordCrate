[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[[edge_functions]]
  function = "og-review"
  path = "/og/review/:id"

# Billboard API redirect - must come BEFORE the catch-all
[[redirects]]
  from = "/api/billboard/*"
  to = "/.netlify/functions/billboard"
  status = 200
  force = true

# SPA catch-all redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200